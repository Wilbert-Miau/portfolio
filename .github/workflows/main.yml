name: Deploy Astro to S3 + CloudFront

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./portfolio-site
        run: npm ci

      - name: Build Astro site
        working-directory: ./portfolio-site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Resolve deploy bucket from CloudFront origin
        run: |
          dist_id="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          configured_bucket="${{ secrets.S3_BUCKET }}"
          origin_bucket=""

          if [ -n "$dist_id" ]; then
            set +e
            origin_domain=$(aws cloudfront get-distribution \
              --id "$dist_id" \
              --query 'Distribution.DistributionConfig.Origins.Items[0].DomainName' \
              --output text 2>/tmp/cf_get_distribution_error.log)
            cf_status=$?
            set -e

            if [ "$cf_status" -eq 0 ] && [ -n "$origin_domain" ] && [ "$origin_domain" != "None" ]; then
              origin_bucket="${origin_domain%%.s3*}"
              echo "CloudFront origin domain: $origin_domain"
              echo "CloudFront origin bucket: $origin_bucket"
            else
              echo "::warning title=CloudFront lookup skipped::Could not read distribution origin (missing permission or invalid distribution id). Falling back to S3_BUCKET secret."
            fi
          else
            echo "::warning title=Missing CLOUDFRONT_DISTRIBUTION_ID::Falling back to S3_BUCKET secret."
          fi

          if [ -n "$origin_bucket" ]; then
            if [ -n "$configured_bucket" ] && [ "$origin_bucket" != "$configured_bucket" ]; then
              echo "::warning title=S3_BUCKET secret mismatch::CloudFront uses '$origin_bucket' but S3_BUCKET is '$configured_bucket'. Deploying to CloudFront origin bucket."
            fi
            echo "DEPLOY_BUCKET=$origin_bucket" >> "$GITHUB_ENV"
          elif [ -n "$configured_bucket" ]; then
            echo "DEPLOY_BUCKET=$configured_bucket" >> "$GITHUB_ENV"
            echo "::warning title=Using S3_BUCKET fallback::Set cloudfront:GetDistribution permission to auto-resolve origin bucket."
          else
            echo "::error title=No deploy bucket available::Set S3_BUCKET secret or grant cloudfront:GetDistribution on CLOUDFRONT_DISTRIBUTION_ID."
            exit 1
          fi

      - name: Upload to S3
        run: |
          aws s3 sync ./portfolio-site/dist s3://${{ env.DEPLOY_BUCKET }} --delete

      - name: Create directory-route objects for S3 REST origin
        run: |
          # With private S3 + CloudFront (non-website endpoint), /en/ and /es/ are looked up as object keys.
          # Create explicit objects so these routes work even without CloudFront URI rewrite.
          aws s3api put-object --bucket ${{ env.DEPLOY_BUCKET }} --key en/ --body ./portfolio-site/dist/en/index.html --content-type text/html
          aws s3api put-object --bucket ${{ env.DEPLOY_BUCKET }} --key es/ --body ./portfolio-site/dist/es/index.html --content-type text/html

      - name: Verify files in S3
        run: |
          aws s3 ls s3://${{ env.DEPLOY_BUCKET }} --recursive | head -n 50
          aws s3api head-object --bucket ${{ env.DEPLOY_BUCKET }} --key index.html > /dev/null
          aws s3api head-object --bucket ${{ env.DEPLOY_BUCKET }} --key en/ > /dev/null
          aws s3api head-object --bucket ${{ env.DEPLOY_BUCKET }} --key en/index.html > /dev/null
          aws s3api head-object --bucket ${{ env.DEPLOY_BUCKET }} --key es/ > /dev/null
          aws s3api head-object --bucket ${{ env.DEPLOY_BUCKET }} --key es/index.html > /dev/null
          aws s3api head-object --bucket ${{ env.DEPLOY_BUCKET }} --key favicon.ico > /dev/null
          aws s3api head-object --bucket ${{ env.DEPLOY_BUCKET }} --key Wilbert-Castillo-Infrastructure-Engineer-Resume.pdf > /dev/null

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
